name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    name: Run Functional Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm install -g playwright
          npx playwright install chromium

      - name: Create test runner script
        run: |
          cat > run-tests.js << 'EOF'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');

          async function runTests() {
            console.log('🚀 Starting test execution...\n');

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext();
            const page = await context.newPage();

            // Listen for console messages
            page.on('console', msg => {
              const text = msg.text();
              if (text.includes('Total tests:') || text.includes('Passed:') || text.includes('Failed:')) {
                console.log('📊', text);
              }
            });

            // Load the test page
            const testPath = path.join(__dirname, 'tests.html');
            await page.goto(`file://${testPath}`);

            // Wait for page to load
            await page.waitForLoadState('domcontentloaded');

            // Run the tests
            await page.evaluate(() => {
              return new Promise((resolve) => {
                runAllTests();
                // Wait a bit for tests to complete
                setTimeout(resolve, 2000);
              });
            });

            // Extract test results
            const results = await page.evaluate(() => {
              return {
                total: parseInt(document.getElementById('totalTests').textContent),
                passed: parseInt(document.getElementById('passedTests').textContent),
                failed: parseInt(document.getElementById('failedTests').textContent),
                passRate: document.getElementById('passRate').textContent
              };
            });

            // Get failed test details
            const failedTests = await page.evaluate(() => {
              const failed = [];
              document.querySelectorAll('.test-case.failed').forEach(testCase => {
                const name = testCase.querySelector('.test-name').textContent;
                const errorDiv = testCase.querySelector('.error-details');
                const error = errorDiv ? errorDiv.textContent.replace('Error: ', '') : 'Unknown error';
                failed.push({ name, error });
              });
              return failed;
            });

            await browser.close();

            // Print results
            console.log('\n' + '='.repeat(70));
            console.log('📋 TEST RESULTS SUMMARY');
            console.log('='.repeat(70));
            console.log(`Total Tests:  ${results.total}`);
            console.log(`✅ Passed:     ${results.passed}`);
            console.log(`❌ Failed:     ${results.failed}`);
            console.log(`📊 Pass Rate:  ${results.passRate}`);
            console.log('='.repeat(70));

            if (failedTests.length > 0) {
              console.log('\n❌ FAILED TESTS:\n');
              failedTests.forEach((test, index) => {
                console.log(`${index + 1}. ${test.name}`);
                console.log(`   Error: ${test.error}\n`);
              });
            }

            // Create test report artifact
            const report = {
              timestamp: new Date().toISOString(),
              results: results,
              failedTests: failedTests,
              success: results.failed === 0
            };

            fs.writeFileSync('test-report.json', JSON.stringify(report, null, 2));
            console.log('\n📄 Test report saved to test-report.json\n');

            // Exit with appropriate code
            if (results.failed > 0) {
              console.error('\n❌ Tests failed! Exiting with error code 1\n');
              process.exit(1);
            } else {
              console.log('\n✅ All tests passed! 🎉\n');
              process.exit(0);
            }
          }

          runTests().catch(error => {
            console.error('❌ Error running tests:', error);
            process.exit(1);
          });
          EOF

      - name: Run tests
        run: node run-tests.js

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-node-${{ matrix.node-version }}
          path: test-report.json

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('test-report.json', 'utf8'));

            const emoji = report.success ? '✅' : '❌';
            const status = report.success ? 'PASSED' : 'FAILED';

            let comment = `## ${emoji} Test Results - ${status}\n\n`;
            comment += `**Node Version:** ${{ matrix.node-version }}\n\n`;
            comment += `| Metric | Value |\n`;
            comment += `|--------|-------|\n`;
            comment += `| Total Tests | ${report.results.total} |\n`;
            comment += `| ✅ Passed | ${report.results.passed} |\n`;
            comment += `| ❌ Failed | ${report.results.failed} |\n`;
            comment += `| 📊 Pass Rate | ${report.results.passRate} |\n\n`;

            if (report.failedTests.length > 0) {
              comment += `### ❌ Failed Tests\n\n`;
              report.failedTests.forEach((test, index) => {
                comment += `${index + 1}. **${test.name}**\n`;
                comment += `   \`\`\`\n   ${test.error}\n   \`\`\`\n\n`;
              });
            }

            comment += `---\n*Generated at ${report.timestamp}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint:
    name: Lint HTML/CSS/JS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML files
        run: |
          htmlhint "*.html" || true
          echo "✅ HTML linting complete"

  build:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build artifact
        run: |
          mkdir -p build
          cp *.html build/
          cp *.csv build/ || true
          cp *.md build/ || true
          echo "Build completed at $(date)" > build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-preview
          path: build/
          retention-days: 7

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        run: |
          echo "❌ Tests failed on main branch!"
          echo "Please check the workflow logs for details."
          # Add Slack/Discord/Email notification here if needed
