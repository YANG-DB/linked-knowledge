name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    name: Run Functional Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Run tests
        run: node run-tests.js

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-node-${{ matrix.node-version }}
          path: test-report.json

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('test-report.json', 'utf8'));

            const emoji = report.success ? '✅' : '❌';
            const status = report.success ? 'PASSED' : 'FAILED';

            let comment = `## ${emoji} Test Results - ${status}\n\n`;
            comment += `**Node Version:** ${{ matrix.node-version }}\n\n`;
            comment += `| Metric | Value |\n`;
            comment += `|--------|-------|\n`;
            comment += `| Total Tests | ${report.results.total} |\n`;
            comment += `| ✅ Passed | ${report.results.passed} |\n`;
            comment += `| ❌ Failed | ${report.results.failed} |\n`;
            comment += `| 📊 Pass Rate | ${report.results.passRate} |\n\n`;

            if (report.failedTests.length > 0) {
              comment += `### ❌ Failed Tests\n\n`;
              report.failedTests.forEach((test, index) => {
                comment += `${index + 1}. **${test.name}**\n`;
                comment += `   \`\`\`\n   ${test.error}\n   \`\`\`\n\n`;
              });
            }

            comment += `---\n*Generated at ${report.timestamp}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint:
    name: Lint HTML/CSS/JS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML files
        run: |
          htmlhint "*.html" || true
          echo "✅ HTML linting complete"

  build:
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build artifact
        run: |
          mkdir -p build
          cp *.html build/
          cp *.csv build/ || true
          cp *.md build/ || true
          echo "Build completed at $(date)" > build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-preview
          path: build/
          retention-days: 7

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Send notification
        run: |
          echo "❌ Tests failed on main branch!"
          echo "Please check the workflow logs for details."
          # Add Slack/Discord/Email notification here if needed
